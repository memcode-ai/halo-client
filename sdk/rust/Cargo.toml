[package]
name = "halo-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Halo Agent SDK for Rust: drive the installed Halo from your programs and agents."
license = "Apache-2.0"
repository = "https://github.com/memcode-ai/halo-client"

[lib]
name = "halo_sdk"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1.45.1", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
